<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MapScout — Prospecção de Vendas de Sites{% endblock %}</title>
    <!-- HTMX para interatividade sem JavaScript complexo -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-dark">
    <header class="navbar">
        <div class="container nav-content">
            <div class="brand">
                <svg class="icon icon-radar" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M12 2a10 10 0 0 0 0 20"/></svg>
                <div class="brand-text">
                    <span class="brand-title">MapScout</span>
                    <span class="brand-badge">Radar de Oportunidades</span>
                </div>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-item active">Leads & Oportunidades</a>
                <button 
                    class="btn btn-primary btn-sm"
                    hx-get="/partials/modal/varrer"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                >
                    <svg class="icon icon-scan" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Nova Varredura
                </button>
                <button 
                    class="btn btn-secondary btn-sm"
                    hx-post="/api/jobs/enriquecer"
                    hx-target="#job-status-banner"
                    hx-swap="outerHTML"
                >
                    <svg class="icon icon-zap" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6.5 2 1.6 3 3 5.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                    Enriquecer
                </button>
                <button 
                    class="btn btn-secondary btn-sm"
                    hx-get="/partials/automacoes"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                >
                    <svg class="icon icon-clock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Automações
                </button>
                <a href="/exportar" class="btn btn-secondary btn-sm" download>
                    <svg class="icon icon-download" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    CSV
                </a>
                <div style="display: flex; align-items: center; gap: 10px; margin-left: 8px; padding-left: 12px; border-left: 1px solid var(--border-subtle);">
                    <span style="font-size: 13px; color: var(--text-muted); font-weight: 500;">
                        <svg class="icon icon-user" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> {{ request.state.usuario if request.state and request.state.usuario else "Conectado" }}
                    </span>
                    <a href="/logout" class="btn btn-secondary btn-sm" style="color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3);" title="Encerrar sessão">
                        <svg class="icon icon-log-out" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sair
                    </a>
                </div>
            </nav>
        </div>
    </header>
 
    <main class="container main-content">
        <div id="job-status-banner">
            {% if task %}
                {% include "partials/job_status.html" %}
            {% endif %}
        </div>
        {% block content %}{% endblock %}
    </main>
 
    <div id="modal-container"></div>
 
    <script>
        function copiarTexto(elementId, btn) {
            const el = document.getElementById(elementId);
            if (!el) return;
            navigator.clipboard.writeText(el.value || el.innerText).then(() => {
                const textoOriginal = btn.innerText;
                btn.innerText = "✓ Copiado!";
                btn.classList.add("btn-success");
                setTimeout(() => {
                    btn.innerText = textoOriginal;
                    btn.classList.remove("btn-success");
                }, 2000);
            });
        }
 
        function fecharModal() {
            const modal = document.querySelector('.modal-overlay');
            if (modal) modal.remove();
        }
    </script>
</body>
</html>
