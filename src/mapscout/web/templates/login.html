<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MapScout Radar</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top, #182232 0%, #0b0f17 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }
        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .login-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body class="theme-dark">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon"><svg class="icon icon-radar" width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><path d="M12 2a10 10 0 0 0 0 20"/></svg></div>
                <h1 class="login-title">MapScout</h1>
                <p class="login-subtitle">Acesso restrito de inteligência comercial</p>
            </div>

            {% if erro %}
            <div class="login-error">
                <span><svg class="icon icon-alert-triangle" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
                <span>{{ erro }}</span>
            </div>
            {% endif %}

            <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 18px;">
                <div class="filter-group">
                    <label style="font-size: 13px; font-weight: 600; color: var(--text-main);">Usuário</label>
                    <input 
                        type="text" 
                        name="usuario" 
                        class="input-control" 
                        placeholder="Digite seu usuário..." 
                        required 
                        autofocus
                    >
                </div>

                <div class="filter-group">
                    <label style="font-size: 13px; font-weight: 600; color: var(--text-main);">Senha</label>
                    <input 
                        type="password" 
                        name="senha" 
                        class="input-control" 
                        placeholder="Digite sua senha..." 
                        required
                    >
                </div>

                <button 
                    type="submit" 
                    class="btn btn-primary" 
                    style="width: 100%; padding: 12px; font-size: 14px; font-weight: 600; margin-top: 6px;"
                >
                    Entrar no Sistema →
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-dim);">
                <svg class="icon icon-shield" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: middle;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Protegido com criptografia HMAC-SHA256
            </div>
        </div>
    </div>
</body>
</html>
